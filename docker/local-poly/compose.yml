name: forgeloop-ai
services:
  forgeloop-ai-strata:
    image: forgeloop-ai-strata:0.2.2-poly-local
    build:
      context: ../..
      dockerfile: docker/local-poly/Dockerfile
    container_name: forgeloop-ai-strata
    init: true
    restart: unless-stopped
    stop_grace_period: 90s
    devices:
      - nvidia.com/gpu=1
    ulimits:
      memlock: -1
    ports:
      - "127.0.0.1:10110:8791"
    environment:
      DEFAULT_MODEL: ornith-iq3
    volumes:
      - forgeloop-ai-strata-local-data:/data
      - forgeloop-ai-polystrata-legacy-data:/legacy-data:ro
      - /mnt/llm-models/ornith-1.5-122b-uncensored-atomicchat:/models-ornith:ro
      - /mnt/llm-models/ornith-1.5-122b-bartowski:/models-ornith-bartowski:ro
      - /mnt/llm-models/minicpm-v-4.7-35b-a3b:/models:ro
      - /mnt/llm-models/strata-swift:/models-swift:ro
      - /mnt/llm-models/gemma-4-26b-a4b-unsloth:/models-gemma:ro
    networks:
      - forgeloop-ai-strata-local-network
    labels:
      forgeloop.managed: "true"
      forgeloop.project: forgeloop-ai
      forgeloop.resource: llm
volumes:
  forgeloop-ai-strata-local-data:
    name: forgeloop-ai-strata-local-data
    labels:
      forgeloop.managed: "true"
      forgeloop.project: forgeloop-ai
      forgeloop.resource: llm-data
  forgeloop-ai-polystrata-legacy-data:
    external: true
    name: forgeloop-ai_forgeloop-ai-polystrata-data
networks:
  forgeloop-ai-strata-local-network:
    name: forgeloop-ai-strata-local-network
    labels:
      forgeloop.managed: "true"
      forgeloop.project: forgeloop-ai
      forgeloop.resource: llm-network
